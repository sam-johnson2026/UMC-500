name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # syntax-checks the viewer's ES modules
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Example programs stay clean
        run: |
          python -m umc_twin simulate examples/demo_5axis.nc --setup examples/setup_demo.yaml --strict
          python -m umc_twin simulate examples/macro_comp_demo.nc --setup examples/setup_demo.yaml --strict
          node --check web/app.js
